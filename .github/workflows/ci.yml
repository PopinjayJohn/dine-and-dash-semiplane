# CI for the wiki.
#
# Every job runs a make target, not a raw go command, so that what CI proves and
# what a developer runs locally are the same thing. If a job needs a flag that
# the Makefile does not have, add the target rather than the flag.
#
# Actions are pinned to commit SHAs. This repository is a security-sensitive
# application whose whole point is that it can be run offline by one person on
# one machine; a CI run that can execute unreviewed third-party code is the
# softest thing in it. The tag each SHA came from is in the comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The same checks, for a maintainer pushing straight to a branch.
  merge_group:

# No job needs to write to the repository. The oldest setting that is safe is
# the one that ships.
permissions:
  contents: read

# A new push to a pull request cancels the previous run. Waiting for a stale
# result is worse than not running it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt, vet and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1 # 3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The changelog check needs history, and a shallow clone is the
          # default for a speed this repository does not need.
          fetch-depth: 0

      - uses: actions/setup-go@v7.0.0 # b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve the pinned linter version from the Makefile
        id: pinned
        run: echo "version=$(make --no-print-directory print-golangci-lint-version)" >> "$GITHUB_OUTPUT"

      # The generated templ output is committed, so a `.templ` edited without a
      # regeneration would otherwise be a template and a `_templ.go` that
      # disagree, and the disagreement is invisible until the page renders the old
      # thing.
      - name: Generated code is up to date
        run: make generate-check

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0 # ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: ${{ steps.pinned.outputs.version }}

      - name: Formatting
        run: make fmt-check

      - name: Vet
        run: make vet

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pure Go, no CGO (ADR 0004). The matrix is what keeps that true: a
        # change that reintroduces a cgo dependency fails here on a runner
        # with no toolchain rather than on a DM's laptop.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1 # 3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@v7.0.0 # b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make test

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1 # 3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@v7.0.0 # b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      # The floor lives in the Makefile, so a lowering of the floor is a
      # reviewed diff rather than a number in a workflow nobody reads.
      - name: Cover
        run: make cover

      - name: Upload the profile
        if: always()
        uses: actions/upload-artifact@v7 # 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1 # 3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@v7.0.0 # b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      # A binary that compiles is not a binary that runs, and the thing this
      # milestone shipped is the part that runs.
      #
      # The wiki is booted against a data directory with one campaign in it, the
      # health line is asked for over HTTP, and the process is then asked to stop
      # and has to actually stop -- a server that does not shut down cleanly leaves
      # a lock file behind, and that is a bug the tests found once and will find
      # again.
      - name: Smoke test
        run: |
          ./bin/wiki version
          ./bin/wiki help
          # A single static binary, or ADR 0004's claim is quietly false.
          file bin/wiki

          data=$(mktemp -d)
          mkdir -p "$data/vault/blackwater"
          printf -- '---\ntitle: The Blackwater\n---\n\nA campaign.\n' \
            > "$data/vault/blackwater/campaign.md"

          ./bin/wiki serve --data-dir "$data" --addr 127.0.0.1:8123 --no-watch &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8123/_/healthz > healthz.json; then
              break
            fi
            sleep 0.2
          done

          cat healthz.json
          grep -q '"status": "ok"' healthz.json

          # And a campaign root, which is the first thing a player sees and the
          # first thing that has to not be a stack trace.
          curl -fsS http://127.0.0.1:8123/c/blackwater/ > root.html
          grep -q 'The Blackwater' root.html

          kill -TERM "$server"
          wait "$server"

  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1 # 3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Check
        run: ./scripts/check-changelog.sh

  spike:
    name: datastar spike
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1 # 3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@v7.0.0 # b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      # The spike is a separate module under spike/, deliberately outside the
      # application's dependency graph. This job is the "known risk" in
      # docs/spec.md §3 staying answered: a datastar-go upgrade that changes
      # the wire protocol fails here, not in a browser at a table.
      - name: Spike
        run: make spike
